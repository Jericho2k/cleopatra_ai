name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Schema tests apply db/*.sql for real, so a unique index or check
      # constraint that would not actually reject bad data cannot pass.
      # tests/test_schema_pipeline.py additionally builds the WHOLE schema from
      # scratch here — base schema then every migration in db/migration_order.txt
      # — so a migration that only applies to the live database cannot pass
      # either (DB-000). CI never writes to production.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      # Ruff was already installed here and never run, so it enforced nothing.
      # This is a deliberately narrow FATAL subset, not a style gate: syntax and
      # runtime errors (E9), always-wrong comparisons and f-strings (F63, F7),
      # undefined names (F82), and dead imports/redefinitions/locals (F401,
      # F811, F841) — the last three because they are how a half-finished
      # refactor hides. Formatting and the hundreds of style warnings in this
      # codebase stay out of scope; widening this is its own piece of work.
      - name: Ruff (fatal subset)
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 .
      # Cheapest possible check, and the one guarding the worst mistake in this
      # repository's history: a CI-only fixture nearly being applied to the live
      # Supabase project. Needs no database, so it runs before anything else.
      - name: CI fixtures are not migrations
        run: python scripts/production_preflight.py --env-only
      # Fail fast and unambiguously if the schema pipeline itself is broken,
      # before the rest of the suite muddies the output.
      - name: Schema pipeline (base schema + ordered migrations)
        run: pytest -q tests/test_schema_pipeline.py
      # Every module must at least import. compileall catches a syntax error in
      # a file no test happens to reach.
      - name: Compile every module
        run: python -m compileall -q . -x '(\.git|node_modules)'
      - run: pytest -q
